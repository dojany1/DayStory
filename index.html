<!doctype html>
<html lang="ko">

<!--
  =====================================================================
  index.html — DayStory 앱의 루트(뿌리) HTML 파일
  =====================================================================
  이 파일은 브라우저가 가장 먼저 읽는 뼈대 파일입니다.
  
  구조:
    1) <head> : 메타 정보, 폰트 로딩, 페이지 제목
    2) <body> :
       - #splash-screen : 앱 시작 시 보이는 로딩 화면
       - #app-container : 실제 앱 화면 (처음에는 숨겨져 있음)
         - #page-container : 각 페이지가 동적으로 삽입되는 영역
         - #bottom-nav     : 하단 내비게이션 바 (홈/컬렉션/설정)
       - #toast-container : 토스트 알림이 표시되는 영역
       - main.js          : 앱의 시작점 (모듈 스크립트)
  ===================================================================== -->

<head>
  <!-- 기본 메타 태그 -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="description" content="매일의 역사 한 조각을 카드로 만나는 큐레이션 서비스" />

  <!-- 모바일 앱 관련 메타 태그 -->
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- 파비콘 (브라우저 탭 아이콘) -->
  <link rel="icon" type="image/png" href="/daystory_icon_light.png" />
  <link rel="apple-touch-icon" href="/daystory_icon_light.png" />

  <!-- ============================================
       Open Graph / Twitter Card — SNS 공유 미리보기
       ============================================
       기본 메타 태그입니다. 카드별 동적 OG는 Cloud Functions
       (/share/:id) 가 봇 User-Agent를 감지하면 덮어씁니다.
  -->
  <meta property="og:site_name" content="DayStory" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="DayStory — 오늘, 역사 속에서" />
  <meta property="og:description" content="매일의 역사 한 조각을 카드로 만나는 큐레이션 서비스" />
  <meta property="og:image" content="https://daystory.app/og-default.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://daystory.app/" />
  <meta property="og:locale" content="ko_KR" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="DayStory — 오늘, 역사 속에서" />
  <meta name="twitter:description" content="매일의 역사 한 조각을 카드로 만나는 큐레이션 서비스" />
  <meta name="twitter:image" content="https://daystory.app/og-default.png" />

  <!-- 카카오톡 메시지 미리보기는 og:image 사용 (별도 태그 불필요) -->

  <!--
    ===== 웹 폰트 로딩 =====
    1) Inter       : 영문 본문용 산세리프 폰트
    2) Noto Serif KR : 한글 제목용 세리프 폰트 (사용하지 않을 수도 있음)
    3) Playfair Display : 영문 제목용 고급 세리프 폰트 (Day Story 로고 등)
    4) LINESeedKR  : 한글 본문용 폰트 (아래 @font-face로 직접 로딩)
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Serif+KR:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet" />

  <!-- LINE Seed 한글 폰트 (CDN에서 직접 로딩) -->
  <style>
    /* 일반 굵기 (400) */
    @font-face {
      font-family: 'LINESeedKR';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Rg.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }

    /* 굵은 글씨 (700) */
    @font-face {
      font-family: 'LINESeedKR';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Bd.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
    }
    /* 얇은 글씨 (100) */
    @font-face {
      font-family: 'LINESeedKR';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Th.woff2') format('woff2');
      font-weight: 100;
      font-style: normal;
    }
  </style>

  <title>DayStory</title>
</head>

<body>
  <!--
    ===== 모바일 래퍼 (Mobile Wrapper) =====
    데스크톱 브라우저에서도 모바일과 동일한 너비(최대 430px)를 유지하고
    화면 중앙에 카드 형태로 배치하기 위한 최상위 컨테이너입니다.
  -->
  <div class="mobile-wrapper">
    <div id="app">

      <!--
        ===== 스플래시 화면 (Splash Screen) =====
        앱이 처음 로딩될 때 1.2초 동안 보여지는 화면입니다.
        main.js의 initApp()에서 setTimeout 후에 숨겨집니다.
      -->
      <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
          <div class="splash-logo">
            <h1 class="splash-title">DayStory</h1>
            <p class="splash-subtitle">오늘, 역사 속에서</p>
          </div>
          <div class="splash-loader">
            <div class="splash-loader-bar"></div>
          </div>
        </div>
      </div>

      <!--
        ===== 메인 앱 컨테이너 =====
        스플래시 화면이 사라진 후 display:flex로 표시됩니다.
      -->
      <div id="app-container" class="app-container" style="display:none;">

        <!-- 상태바 여백 (모바일 노치 대응) -->
        <div class="status-bar-spacer"></div>

        <!--
          페이지 컨테이너: 라우터가 여기에 각 페이지를 동적으로 삽입합니다.
          예: renderHome()이 반환한 DOM이 여기 안에 들어갑니다.
        -->
        <main id="page-container" class="page-container"></main>

        <!--
          하단 내비게이션 바:
          홈, 임시, 프로필 세 개의 버튼으로 구성됩니다.
          data-route 속성을 보고 router.js에서 해당 경로로 이동합니다.
        -->
        <nav id="bottom-nav" class="bottom-nav redesigned-nav" style="display:none;">
          <!-- 편지 탭 (오늘의 편지 = 에디터 일화) -->
          <button class="nav-item active" data-route="/editorstory" id="nav-editorstory" aria-label="편지">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect>
              <path d="M3.5 7.5 12 13.5 20.5 7.5"></path>
            </svg>
          </button>

          <!-- 캘린더 탭 -->
          <button class="nav-item" data-route="/calendar" id="nav-calendar" aria-label="캘린더">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"></rect>
              <line x1="3" y1="10" x2="21" y2="10"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="16" y1="2" x2="16" y2="6"></line>
            </svg>
          </button>

          <!-- 내 일기 탭 (중앙 원형 강조 버튼) -->
          <button class="nav-item nav-item-center" data-route="/mystory" id="nav-mystory" aria-label="내 일기">
            <span class="nav-center-circle">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path>
              </svg>
            </span>
          </button>

          <!-- 보관함 탭 (세션 1 #7: AAB의 "북마크" → "보관함") -->
          <button class="nav-item" data-route="/bookmarks" id="nav-bookmarks" aria-label="보관함">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 8v13H3V8"></path>
              <path d="M1 3h22v5H1z"></path>
              <path d="M10 12h4"></path>
            </svg>
          </button>

          <!-- 설정 탭 (로그인 여부에 따라 js에서 동적 업데이트) -->
          <button class="nav-item" data-route="/profile" id="nav-profile" aria-label="설정">
            <div class="nav-profile-img-wrap">
              <svg class="nav-icon settings-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </div>
          </button>
        </nav>

      </div>
    </div>
  </div>

  <!--
    토스트 컨테이너: showToast() 함수가 여기에 알림을 추가합니다.
    화면 하단에 고정(fixed)되어 있습니다.
  -->
  <div id="toast-container" class="toast-container"></div>

  <!--
    앱의 시작점: main.js
    type="module"은 ES6 import/export를 사용하겠다는 의미입니다.
  -->
  <script type="module" src="/src/main.js"></script>
</body>

</html>
